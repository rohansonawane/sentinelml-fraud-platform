[alembic]
script_location = alembic
# Production example — does NOT point at the developer's existing Postgres :5432.
# docker compose --profile full uses Postgres on host port 5433.
sqlalchemy.url = postgresql+psycopg2://sentinel:sentinel@localhost:5433/sentinelml

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
