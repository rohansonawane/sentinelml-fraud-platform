name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync
        run: uv sync --extra dev --no-cache
      - name: Lint
        run: uv run ruff check src scripts tests
      - name: Unit tests
        run: uv run pytest tests/unit tests/data tests/model -q --tb=short
      # CI does not download OpenML, Feast extras, or CUDA wheels.
      # make smoke (train) is intended for local M4 / a GPU machine.
