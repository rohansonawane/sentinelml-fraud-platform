# First NVIDIA run: ~200k simulated transactions. Tens of minutes, not Mac smoke.
# Not executed on Apple Silicon. Metrics go to artifacts/gpu/ — never mix with README toy numbers.

seed: 42
device: cuda
data_path: data/generated/gpu_transactions.parquet
artifacts_dir: artifacts/gpu
label_delay_days: 7

split:
  train_fraction: 0.60
  val_fraction: 0.20
  test_fraction: 0.20

optuna:
  n_trials: 40
  timeout_seconds: 1800
  metric: pr_auc

selection:
  weights:
    pr_auc: 0.35
    recall: 0.20
    fpr_inverted: 0.15
    cost_inverted: 0.20
    latency_inverted: 0.05
    memory_inverted: 0.05

thresholds:
  strategies:
    - maximize_f1
    - maximize_recall_at_max_fpr
    - minimize_configured_cost
  max_fpr: 0.05
  default_strategy: minimize_configured_cost

decision:
  allow_max: 0.20
  review_max: 0.70
  default_ambiguous: REVIEW

models:
  dummy:
    enabled: true
  logistic:
    enabled: true
    C: 1.0
    class_weight: balanced
    max_iter: 800
  lightgbm:
    enabled: true
    n_estimators: 400
    max_depth: 8
    learning_rate: 0.05
    num_leaves: 48
  hist_gbdt:
    enabled: true
    max_iter: 300
    max_depth: 8
    learning_rate: 0.05
  xgboost:
    enabled: true
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    device: cuda
  mlp_torch:
    enabled: true
    hidden_dims: [256, 128, 64]
    epochs: 40
    batch_size: 2048
    lr: 0.001
    device: cuda
  mlp_sklearn:
    enabled: false
  isolation_forest:
    enabled: true
    n_estimators: 200
    contamination: 0.03

calibration:
  methods: [none, platt, isotonic]
  apply_if_improves: brier
  reject_if_hurts:
    pr_auc_drop: 0.02
    cost_increase_ratio: 0.15
