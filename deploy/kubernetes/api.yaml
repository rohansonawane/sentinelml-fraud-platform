apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelml-api
  labels:
    app: sentinelml-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelml-api
  template:
    metadata:
      labels:
        app: sentinelml-api
    spec:
      containers:
        - name: api
          image: sentinelml-api:0.1.0
          ports:
            - containerPort: 8102
          envFrom:
            - configMapRef:
                name: sentinelml-config
            - secretRef:
                name: sentinelml-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8102
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8102
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelml-api
spec:
  selector:
    app: sentinelml-api
  ports:
    - port: 8102
      targetPort: 8102
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinelml-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinelml-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
