apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelml-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinelml-dashboard
  template:
    metadata:
      labels:
        app: sentinelml-dashboard
    spec:
      containers:
        - name: dashboard
          image: sentinelml-dashboard:0.1.0
          ports:
            - containerPort: 3102
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3102
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3102
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelml-dashboard
spec:
  selector:
    app: sentinelml-dashboard
  ports:
    - port: 3102
      targetPort: 3102
