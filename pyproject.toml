[project]
name = "sentinelml"
version = "0.1.0"
description = "Real-time fraud detection, streaming feature engineering, model monitoring and automated MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Rohan Sonawane" }]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "pandas>=2.2.0,<3",
  "pyarrow>=17.0.0,<22",
  "numpy>=1.26.0,<3",
  "scikit-learn>=1.5.0,<2",
  "lightgbm>=4.5.0,<5",
  "xgboost>=2.1.0,<4",
  "torch>=2.4.0,<3",
  "mlflow>=2.17.0,<3",
  "optuna>=4.0.0,<5",
  "redis>=5.2.0,<6",
  "prometheus-client>=0.21.0,<1",
  "pyyaml>=6.0.2,<7",
  "joblib>=1.4.0,<2",
  "structlog>=26.1.0,<27",
  "httpx>=0.27.0,<1",
  "sqlalchemy>=2.0.36,<3",
  "kafka-python>=2.0.2,<3",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "ruff>=0.8.0,<1",
  "mypy>=1.13.0,<2",
  "pandas-stubs>=2.2.0",
  "types-pyyaml>=6.0.12",
  "types-redis>=4.6.0",
]
shap = ["shap>=0.46.0,<1"]
xgboost = ["xgboost>=2.1.0,<3"]
feast = ["feast>=0.40.0,<1"]
evidently = ["evidently>=0.4.40,<1"]

[project.scripts]
sentinelml-api = "sentinelml.api.app:run"
sentinelml-stream = "sentinelml.streaming.processor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP017", "SIM108", "SIM102", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
markers = [
  "slow: longer-running tests skipped in default smoke",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src/sentinelml"]
warn_unused_ignores = true
warn_redundant_casts = true
