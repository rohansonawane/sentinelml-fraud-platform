# SentinelML compose. Docker daemon was DOWN at discovery — this file is for
# when Docker is available. Kafka was not started for smoke.
#
# Host Redis :6379 and PostgreSQL :5432 are already running on the laptop.
# This compose does NOT bind those ports. Optional `full` profile starts
# isolated Redis/Postgres on 6382/5433.

services:
  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8

  api:
    build: .
    ports:
      - "8102:8102"
    environment:
      API_PORT: "8102"
      STREAM_BACKEND: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ONLINE_STORE_BACKEND: memory
      REDIS_URL: redis://host.docker.internal:6379/2
      AUDIT_DATABASE_URL: sqlite:///artifacts/audit.db
      MLFLOW_TRACKING_URI: http://mlflow:5102
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    volumes:
      - ./artifacts:/app/artifacts

  dashboard:
    image: node:22-alpine
    working_dir: /ui
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3102"
    ports:
      - "3102:3102"
    volumes:
      - ./dashboard:/ui
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3102"]
      interval: 20s
      timeout: 5s
      retries: 8

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: mlflow server --host 0.0.0.0 --port 5102 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlartifacts
    ports:
      - "5102:5102"
    volumes:
      - mlflow-data:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5102')"]
      interval: 20s
      timeout: 5s
      retries: 8

  redis-optional:
    profiles: ["full"]
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres-optional:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelml
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelml"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Does not bind host :5432 (user's existing Postgres).

volumes:
  mlflow-data:
